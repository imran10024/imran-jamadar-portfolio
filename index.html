<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imran Jamadar — Engineering Director, Senior Staff Architect & Engineering Leader</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --navy-light: #1d3461;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-pale: #f5ead4;
    --slate: #8892b0;
    --slate-light: #a8b2d8;
    --white: #e6f1ff;
    --bg: #0a1628;
    --surface: #112240;
    --surface2: #1a2f55;
    --text: #ccd6f6;
    --text-muted: #8892b0;
    --border: rgba(201,168,76,0.18);
    --radius: 4px;
    --radius-lg: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 4rem;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    color: var(--gold);
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 400;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    border: 1px solid var(--gold) !important;
    color: var(--gold) !important;
    padding: 0.4rem 1rem;
    border-radius: var(--radius);
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 8rem 4rem 4rem;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -200px; right: -200px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 4rem;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    align-items: center;
  }
  .hero-eyebrow {
    font-size: 0.875rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 400;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .hero-eyebrow::before {
    content: '';
    display: block;
    width: 40px; height: 1px;
    background: var(--gold);
  }
  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.5rem, 4.5vw, 4rem);
    line-height: 1.1;
    color: #e6f1ff;
    margin-bottom: 1rem;
    letter-spacing: -0.01em;
  }
  h1 em {
    font-style: italic;
    color: var(--gold);
  }
  .hero-tagline {
    font-size: 1.125rem;
    color: var(--text-muted);
    max-width: 600px;
    margin-bottom: 2rem;
    font-weight: 300;
    line-height: 1.75;
  }
  .hero-meta {
    display: flex;
    gap: 2rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }
  .hero-meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: var(--slate-light);
  }
  .hero-meta-item svg { color: var(--gold); flex-shrink: 0; }
  .hero-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-block;
    padding: 0.75rem 1.75rem;
    background: var(--gold);
    color: var(--navy);
    font-weight: 500;
    font-size: 0.9rem;
    text-decoration: none;
    border-radius: var(--radius);
    letter-spacing: 0.02em;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-outline {
    display: inline-block;
    padding: 0.75rem 1.75rem;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.9rem;
    text-decoration: none;
    border-radius: var(--radius);
    letter-spacing: 0.02em;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  /* HERO CARD */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem;
    position: relative;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), var(--navy-light));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--navy);
    margin-bottom: 1.25rem;
  }
  .hero-card h3 {
    font-size: 1.125rem;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 0.25rem;
  }
  .hero-card p.role {
    font-size: 0.875rem;
    color: var(--gold);
    margin-bottom: 1.25rem;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1.25rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
  }
  .stat-number {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    color: var(--gold);
    line-height: 1;
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }
  .badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1.25rem;
  }
  .badge {
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--slate-light);
    letter-spacing: 0.04em;
  }

  /* SECTION COMMONS */
  section {
    padding: 6rem 4rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }
  .section-label::after {
    content: '';
    display: block;
    flex: 1;
    height: 1px;
    background: var(--border);
    max-width: 240px;
  }
  h2 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.75rem, 3vw, 2.5rem);
    color: var(--white);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }
  .section-sub {
    color: var(--text-muted);
    font-size: 1rem;
    max-width: 540px;
    margin-bottom: 3rem;
    font-weight: 300;
  }

  /* IMPACT / SKILLS */
  .impact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .impact-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    position: relative;
    transition: border-color 0.2s, transform 0.2s;
  }
  .impact-card:hover {
    border-color: rgba(201,168,76,0.4);
    transform: translateY(-3px);
  }
  .impact-icon {
    width: 40px; height: 40px;
    border-radius: var(--radius);
    background: rgba(201,168,76,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .impact-icon svg { color: var(--gold); }
  .impact-card h3 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }
  .impact-card p {
    font-size: 0.875rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* EXPERIENCE TIMELINE */
  .timeline {
    position: relative;
    margin-top: 2rem;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    padding-left: 3rem;
    padding-bottom: 3.5rem;
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-marker {
    position: absolute;
    left: -4px; top: 8px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 4px var(--bg);
  }
  .time-meta {
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .job-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--white);
    line-height: 1.2;
  }
  .company {
    font-size: 1rem;
    color: var(--slate-light);
    margin-bottom: 1.25rem;
  }
  .job-desc {
    color: var(--text-muted);
    max-width: 760px;
    margin-bottom: 1.5rem;
  }
  .job-highlights-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 800px;
    margin-top: 1rem;
  }
  .highlight-group h4 {
    font-size: 0.9rem;
    color: var(--white);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .highlight-group h4::before {
    content: '▪';
    color: var(--gold);
  }
  .highlight-group ul {
    list-style: none;
    font-size: 0.875rem;
    color: var(--text-muted);
  }
  .highlight-group li {
    margin-bottom: 0.4rem;
    padding-left: 0.75rem;
    position: relative;
  }
